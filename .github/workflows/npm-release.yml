name: npm release

# Publishes ui, ui-widgets, map-canvas, run-events-view and authkit when a
# vX.Y.Z tag matching the root package.json version is pushed. Modelled on
# sk-sdk sdk-npm.yml: the tarballs that pass the checks are the ones published.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tarballs: ${{ steps.pack.outputs.tarballs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install dependencies
        run: |
          npm install --global pnpm@11.13.1
          pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' --if-present run typecheck
      - run: pnpm -r --workspace-concurrency=2 --filter './packages/*' --if-present run test
      - name: Pack and test isolated npm installs
        id: pack
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Expected release tag v$version"
            exit 1
          fi
          artifacts="$RUNNER_TEMP/sites-npm"
          tarballs=$(node scripts/pack-npm.mjs "$version" "$artifacts")
          node scripts/check-packed-npm.mjs "$artifacts"
          echo "tarballs=$tarballs" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sites-npm
          path: ${{ runner.temp }}/sites-npm/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        tarball: ${{ fromJSON(needs.build.outputs.tarballs) }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sites-npm
      - name: Publish tested tarball using npm Trusted Publishing
        env:
          TARBALL: ${{ matrix.tarball }}
        run: npm publish "./$TARBALL" --provenance --access public
