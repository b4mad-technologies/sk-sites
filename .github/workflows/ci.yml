name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install dependencies
        run: |
          npm install --global pnpm@11.13.1
          pnpm install --frozen-lockfile
      # The website is checked in its own job below.
      - run: pnpm -r --filter '!@spellkave/website' --if-present run typecheck
      - run: pnpm -r --workspace-concurrency=2 --filter '!@spellkave/website' --if-present run test
      - name: Build
        run: pnpm -r --filter '!@spellkave/website' --if-present run build
        env:
          # Placeholder build-time settings; account bakes them into its
          # bundle. Build step only: account tests assert their own defaults.
          VITE_SPELLKAVE_API_URL: https://api.example.test
          VITE_SPELLKAVE_LOGIN_ORIGIN: https://login.example.test
          VITE_SPELLKAVE_PLAY_URL: https://play.example.test
          VITE_SPELLKAVE_PUBLIC_SITE_URL: https://www.example.test
          VITE_SPELLKAVE_SITE_URL: https://www.example.test
          VITE_WORKOS_CLIENT_ID: client_ci
          VITE_WORKOS_ISSUER: https://auth.example.test
      - name: Pack the npm packages and test the tarballs
        run: pnpm test:pack

  # Allowed to fail until its inputs are on npm: the website imports
  # @spellkave/srd-cc and reads @spellkave/adventure-kavemouth (sk-content)
  # and world-author docs/ (sk-sdk) by monorepo path. PROVENANCE.md lists what
  # each package must publish. Drop continue-on-error once they exist.
  website:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install dependencies
        run: |
          npm install --global pnpm@11.13.1
          pnpm install --frozen-lockfile
      - run: pnpm --filter @spellkave/website run typecheck
      - run: pnpm --filter @spellkave/website run test
      - run: pnpm --filter @spellkave/website run build
