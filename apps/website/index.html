		<!--
		Three worlds, one product truth. The active theme (sk_theme cookie, ?theme=) picks the arrangement.

		LIVING GRAMMAR (default)
		THESIS: Spellkave is a world that understands intent and changes; refuse the static fantasy hero.
		OWN-WORLD: Midnight jacquard, gold pixel-weave, warm loom paper, square woven controls.
		STORY: See a possible action, understand its response, enter, then shape what others inherit.
		FIRST VIEWPORT: Copy occupies one third; an inhabited woven river road at dusk and the four-step action thread fill the rest; Enter Spellkave leads.
		FORM: The Living Grammar, chosen from the Woven World direction; seed e4db319e.

		LOOM PAPER — THE LIVING CHRONICLE
		THESIS: The world is a chronicle being written while you watch; refuse the hero-plus-benefits page.
		OWN-WORLD: Rag paper, iron-gall ink, a rust stamp for action, Alegreya small caps, ruled and stamped controls.
		STORY: Read today's entry, follow what led here, find your place saved in the margin, enter.
		FIRST VIEWPORT: An open journal spread: entry with ink illustration left, the chronicle and the returning player's margin note with Enter Spellkave right.
		FORM: The Living Chronicle, the recorded pick card of the website direction round (direction-website.json).

		WORLDS IN MOTION — THE LIVE WORLD BOARD
		THESIS: Every world is visibly underway; refuse the cinematic landscape.
		OWN-WORLD: Blackened enamel, amber split-flap plates, brass hairlines, Archivo condensed caps, Sometype Mono figures, route-paper reading band.
		STORY: Read the board, open one world to see it inhabited, enter or watch.
		FIRST VIEWPORT: The headline as board title, four illustrative world rows with status, local time, latest consequence and presence; one row opened onto an amber lithograph.
		FORM: Worlds in Motion, the recorded assigned card of the website direction round (direction-website.json).

		FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
		-->

		<script type="module" src="/src/main.ts"></script>
	</body>
