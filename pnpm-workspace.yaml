packages:
  - apps/*
  - packages/*

engineStrict: true
autoInstallPeers: false

allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
  # wrangler needs the workerd binary for `wrangler dev`.
  workerd: true
  sharp: false

overrides:
  # Security floors carried over from the Spellkave monorepo.
  nanoid: 3.3.18
  source-map-js: 1.2.2
  'svelte>devalue': 5.9.3
  'vitest>tinypool': 2.1.2
  'miniflare>undici': 7.30.1
  'dompurify@<=3.4.16': 3.4.17
  '@pixellab-code/pixellab>zod': 4.6.7

patchedDependencies:
  # Copied from the Spellkave monorepo: lets the PixelLab SDK accept
  # subscription ("generations") usage. design-gen tests cover it.
  '@pixellab-code/pixellab@1.0.2': patches/@pixellab-code__pixellab@1.0.2.patch
